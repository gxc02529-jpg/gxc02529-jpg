<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Build systems that ship</title>
  <desc id="desc">Dark engineering dashboard banner for agent systems, RAG, MCP and A2A.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <ellipse cx="965" cy="145" rx="300" ry="230" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#334155"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="70" y="66" fill="#64748b" font-size="14" letter-spacing="3">ENGINEERING / PRODUCTION</text>
    <text x="68" y="130" fill="#f8fafc" font-size="44" font-weight="700" letter-spacing="2">BUILD SYSTEMS</text>
    <text x="68" y="184" fill="url(#accent)" font-size="44" font-weight="700" letter-spacing="2">THAT SHIP.</text>
    <text x="70" y="225" fill="#94a3b8" font-size="16" letter-spacing="1">AGENT SYSTEMS  /  RAG  /  MCP  /  A2A  /  PLATFORM ENGINEERING</text>

    <rect x="70" y="259" width="9" height="9" rx="2" fill="#4ade80" filter="url(#softGlow)"/>
    <text x="92" y="269" fill="#cbd5e1" font-size="13">DESIGN</text>
    <text x="164" y="269" fill="#475569" font-size="13">→</text>
    <text x="192" y="269" fill="#cbd5e1" font-size="13">BUILD</text>
    <text x="254" y="269" fill="#475569" font-size="13">→</text>
    <text x="282" y="269" fill="#cbd5e1" font-size="13">VERIFY</text>
    <text x="352" y="269" fill="#475569" font-size="13">→</text>
    <text x="380" y="269" fill="#cbd5e1" font-size="13">OPERATE</text>
  </g>

  <g transform="translate(760 58)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="370" height="205" rx="16" fill="#0f172a" fill-opacity="0.78" stroke="#334155"/>
    <circle cx="24" cy="22" r="4" fill="#fb7185"/>
    <circle cx="39" cy="22" r="4" fill="#facc15"/>
    <circle cx="54" cy="22" r="4" fill="#4ade80"/>
    <text x="78" y="27" fill="#64748b" font-size="11">system.graph</text>

    <path d="M64 75 H150 M194 75 H282 M107 75 V125 H150 M237 75 V125 H194" fill="none" stroke="#475569" stroke-width="2"/>
    <rect x="22" y="58" width="86" height="34" rx="8" fill="#172554" stroke="#3b82f6"/>
    <rect x="151" y="58" width="86" height="34" rx="8" fill="#312e81" stroke="#818cf8"/>
    <rect x="280" y="58" width="68" height="34" rx="8" fill="#164e63" stroke="#22d3ee"/>
    <rect x="151" y="111" width="86" height="34" rx="8" fill="#3b0764" stroke="#c084fc"/>
    <rect x="151" y="164" width="86" height="24" rx="7" fill="#052e16" stroke="#4ade80"/>
    <path d="M194 145 V164" stroke="#475569" stroke-width="2"/>

    <text x="43" y="80" fill="#bfdbfe" font-size="12">ROUTER</text>
    <text x="170" y="80" fill="#c7d2fe" font-size="12">AGENTS</text>
    <text x="300" y="80" fill="#a5f3fc" font-size="12">MCP</text>
    <text x="178" y="133" fill="#e9d5ff" font-size="12">RAG</text>
    <text x="173" y="181" fill="#bbf7d0" font-size="11">VERIFIED</text>
  </g>
</svg>
